spring.application.name=cloudtransfer

# Server Configuration
# Explicitly set to 8080 to ensure your Google Redirect URI matches
server.port=8080

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudtransfer
spring.datasource.username=postgres
spring.datasource.password=123

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Critical: File Upload Limits (Increased to allow large file transfers before chunking)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB