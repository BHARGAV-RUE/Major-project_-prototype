spring.application.name=cloudtransfer

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudtransfer
spring.datasource.username=postgres
spring.datasource.password=root

# This tells Hibernate to automatically create our database tables based on our Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

